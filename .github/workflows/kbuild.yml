      - name: Build kernel Image
        run: |
          cd linux
          make -j4 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image

      - name: Collect kernel image
        run: |
          cd linux          
          mkdir -p ../Image-arm64
          cp arch/arm64/boot/Image ../Image-arm64/
          cp System.map ../Image-arm64/ || true
          cp .config ../Image-arm64/ || true
          

      - name: Compress kernel image (7z)
        run: |
          7z a -mx9 kernel-arm64.7z Image-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-arm64
          path: kernel-arm64.7z

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: kernel-arm64
          path: .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.6.8-arm64-${{ github.run_number }}
          name: "Linux Kernel 6.6.8 ARM64 Image"
          body: "Automated build of Linux 6.6.8 ARM64 (Image only, compressed 7z)."
          draft: false
          prerelease: false
          files: kernel-arm64.7z