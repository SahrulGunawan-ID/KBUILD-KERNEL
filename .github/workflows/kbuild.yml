name: Kernel Build ARM64

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write   # supaya bisa push ke release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xz-utils build-essential bc libssl-dev \
            libncurses-dev bison flex dwarves gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu p7zip-full

      - name: Download Linux kernel
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.8.tar.xz
          tar -xf linux-6.6.8.tar.xz
          mv linux-6.6.8 linux

      - name: Configure kernel (allnoconfig)
        run: |
          cd linux
          make -j4 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          ./scripts/config --enable CONFIG_CPU_FREQ_GOV_POWERSAVE
          ./scripts/config --enable CONFIG_CPU_FREQ_GOV_CONSERVATIVE
          ./scripts/config --enable CONFIG_ACPI_CPPC_CPUFREQ
