name: Runner Capacity Test

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Show runner info
        run: |
          echo "=== CPU Info ==="
          nproc
          lscpu | grep -E 'Model name|Socket|Core|Thread'

          echo "=== Memory Info ==="
          free -h

          echo "=== Disk Info ==="
          df -h /

          echo "=== Temp Directory Usage ==="
          du -sh /tmp || true

      - name: Show environment
        run: |
          echo "=== Environment Variables ==="
          env | sort
